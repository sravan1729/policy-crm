<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Policy Register — Insurance CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
:root{
  --ink:#14213D;
  --ink-2:#1F2E4D;
  --steel:#5C6B84;
  --steel-light:#8B96A8;
  --paper:#EEF1F5;
  --paper-card:#FFFFFF;
  --line:#E0E4EA;
  --brass:#B98B3E;
  --brass-dark:#93701E;
  --brass-bg:#FBF3E3;
  --good:#3C7A5A;
  --good-bg:#E7F3ED;
  --warn:#B4700F;
  --warn-bg:#FBF0DA;
  --bad:#B23A32;
  --bad-bg:#FBEAE8;
  --radius:10px;
  --shadow:0 1px 2px rgba(20,33,61,.05),0 6px 16px rgba(20,33,61,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.font-display{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
a{color:inherit;}
::selection{background:var(--brass-bg);color:var(--brass-dark);}

/* ---------- APP SHELL ---------- */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:230px;flex-shrink:0;background:var(--ink);color:#EAEDF4;
  display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 22px 6px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:18px;}
.brand svg{width:26px;height:26px;color:var(--brass);flex-shrink:0;}
.brand-text{line-height:1.15;}
.brand-text b{font-family:'Fraunces',serif;font-size:16.5px;font-weight:600;display:block;}
.brand-text span{font-size:11px;color:#9AA6C0;letter-spacing:.04em;}

.nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;
  color:#C3CBDE;text-decoration:none;font-size:13.5px;font-weight:500;background:none;border:none;text-align:left;width:100%;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(185,139,62,.16);color:#fff;}
.nav-item.active svg{color:var(--brass);}
.nav-badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px;}

.sidebar-foot{padding-top:14px;border-top:1px solid rgba(255,255,255,.1);}
.backend-pill{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#9AA6C0;padding:6px 8px;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot.on{background:#4FBE81;}
.dot.off{background:#8B96A8;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:18px 32px;
  background:var(--paper-card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:19px;margin:0;font-weight:600;}
.topbar .sub{font-size:12.5px;color:var(--steel);margin-top:2px;}
.content{padding:26px 32px 60px;flex:1;}

.hamburger{display:none;background:none;border:none;padding:6px;color:var(--ink);}
.hamburger svg{width:22px;height:22px;}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;border:1px solid transparent;font-size:13.5px;font-weight:600;transition:.12s;white-space:nowrap;}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:var(--ink-2);}
.btn-brass{background:var(--brass);color:#fff;}
.btn-brass:hover{background:var(--brass-dark);}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.btn-ghost:hover{background:var(--paper);}
.btn-danger{background:transparent;color:var(--bad);border-color:#F0CFCB;}
.btn-danger:hover{background:var(--bad-bg);}
.btn-sm{padding:6px 10px;font-size:12.5px;}
.btn-icon{padding:8px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ---------- CARDS / STATS ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.stat-card{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px;box-shadow:var(--shadow);}
.stat-card .label{font-size:12px;color:var(--steel);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.stat-card .value{font-family:'Fraunces',serif;font-size:30px;font-weight:600;margin-top:6px;}
.stat-card .value.bad{color:var(--bad);}
.stat-card .value.warn{color:var(--warn);}
.stat-card .value.good{color:var(--good);}
.stat-card .foot{font-size:12px;color:var(--steel-light);margin-top:4px;}

.card{background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);}
.card-head h2{font-size:15.5px;margin:0;font-weight:600;}
.card-body{padding:18px 20px;}

/* ledger ruled-line texture for dashboard list */
.ledger{background-image:repeating-linear-gradient(to bottom, transparent, transparent 47px, var(--line) 48px);}

/* ---------- TABLE ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--steel);font-weight:700;padding:9px 14px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:hover{background:#FAFBFC;}
td.mono{color:var(--ink-2);}
.cell-name{font-weight:600;}
.cell-sub{font-size:12px;color:var(--steel);margin-top:1px;}
.row-actions{display:flex;gap:4px;justify-content:flex-end;}
.icon-btn{background:none;border:none;padding:6px;border-radius:6px;color:var(--steel);}
.icon-btn:hover{background:var(--paper);color:var(--ink);}
.icon-btn svg{width:15px;height:15px;display:block;}

/* ---------- BADGES ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.badge.bad{background:var(--bad-bg);color:var(--bad);}
.badge.warn{background:var(--warn-bg);color:var(--warn);}
.badge.good{background:var(--good-bg);color:var(--good);}
.badge.neutral{background:#EDEFF3;color:var(--steel);}
.badge.brass{background:var(--brass-bg);color:var(--brass-dark);}

/* ---------- FORMS ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2);}
.field .hint{font-size:11px;color:var(--steel-light);font-weight:400;}
.field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=date],.field input[type=number],.field input[type=month],.field input[type=url],.field select,.field textarea{
  padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brass);outline-offset:0;border-color:var(--brass);}
.field textarea{resize:vertical;min-height:90px;line-height:1.5;}
.field-error{border-color:var(--bad) !important;}
.error-text{font-size:11.5px;color:var(--bad);}
.checkbox-row{display:flex;align-items:center;gap:8px;}
.radio-card-row{display:flex;gap:10px;flex-wrap:wrap;}
.radio-card{border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--steel);display:flex;align-items:center;gap:8px;}
.radio-card.active{border-color:var(--brass);background:var(--brass-bg);color:var(--brass-dark);}

/* filter bar */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
.filter-bar select,.filter-bar input{padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:13px;}
.search-box{position:relative;flex:1;min-width:200px;}
.search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--steel-light);}
.search-box input{width:100%;padding-left:34px;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:6px 13px;border-radius:20px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--steel);background:#fff;}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ---------- MODAL ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,25,40,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:100;}
.modal{background:#fff;border-radius:12px;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .15s ease;}
.modal.wide{max-width:760px;}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-size:16.5px;font-weight:600;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);}
.close-x{background:none;border:none;color:var(--steel);padding:4px;}
.close-x svg{width:18px;height:18px;}

/* ---------- EMPTY / BANNER ---------- */
.empty{text-align:center;padding:50px 20px;color:var(--steel);}
.empty svg{width:34px;height:34px;color:var(--steel-light);margin-bottom:10px;}
.empty h3{margin:0 0 4px;font-size:15px;color:var(--ink);}
.empty p{margin:0 0 16px;font-size:13px;}

.banner{display:flex;align-items:center;gap:12px;background:var(--brass-bg);border:1px solid #EAD6A9;color:var(--brass-dark);padding:11px 18px;border-radius:9px;font-size:13px;margin-bottom:20px;}
.banner button{margin-left:auto;background:none;border:none;color:var(--brass-dark);font-weight:700;font-size:12.5px;text-decoration:underline;}
.banner.info{background:#E9EEF7;border-color:#CFDAEF;color:var(--ink-2);}

/* toast */
#toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:9px;min-width:220px;animation:slidein .18s ease;}
.toast svg{width:15px;height:15px;flex-shrink:0;}
.toast.err{background:var(--bad);}
.toast.ok{background:var(--good);}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--steel);margin:26px 0 12px;}
.section-title:first-child{margin-top:0;}
.helptext{font-size:12.5px;color:var(--steel);line-height:1.6;}
.settings-block{margin-bottom:26px;}
.company-chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);padding:7px 8px 7px 14px;border-radius:20px;font-size:13px;font-weight:600;margin:0 8px 8px 0;}
.company-chip button{background:none;border:none;color:var(--steel-light);padding:2px;border-radius:50%;}
.company-chip button:hover{color:var(--bad);}
.company-chip button svg{width:13px;height:13px;display:block;}

.pagination{display:flex;justify-content:center;align-items:center;gap:10px;padding:14px;font-size:13px;color:var(--steel);}

@media(max-width:880px){
  .sidebar{position:fixed;left:-240px;z-index:50;transition:.2s;box-shadow:0 0 0 2000px rgba(0,0,0,0);}
  .sidebar.open{left:0;box-shadow:0 0 0 2000px rgba(0,0,0,.4);}
  .hamburger{display:block;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .form-grid{grid-template-columns:1fr;}
  .content{padding:18px 14px 50px;}
  .topbar{padding:14px 16px;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-wrap"></div>

<script>
/* =========================================================================
   CONSTANTS
========================================================================= */
const POLICY_TYPES = ["Health Insurance","Motor Insurance - Car","Motor Insurance - Two Wheeler","Term Life Insurance","Life Insurance - Endowment","Life Insurance - ULIP","Travel Insurance","Home Insurance","Personal Accident","Critical Illness","Business Insurance","Other"];
const DEFAULT_COMPANIES = ["HDFC Ergo","Care Health Insurance","ICICI Lombard","Bajaj Allianz","Star Health & Allied Insurance","Tata AIG","New India Assurance","Life Insurance Corporation (LIC)","SBI General Insurance","Niva Bupa","Reliance General Insurance","Max Life Insurance","Go Digit General Insurance","Kotak Mahindra Life","PB (PolicyBazaar)"];
const PAYMENT_FREQUENCIES = ["Annual","Half-Yearly","Quarterly","Monthly"];
const POLICY_STATUSES = ["Active","Renewed","Lapsed","Cancelled"];
const POLICY_FIELDS = ["id","customer_name","email","mobile","policy_number","policy_type","company_name","issue_date","renewal_date","premium_amount","sum_insured","payment_frequency","status","notes","last_reminder_sent","created_at"];

const DEFAULT_TEMPLATE = {
  subject: "Reminder: Your {{policy_type}} policy ({{policy_number}}) is due for renewal",
  body: `Dear {{customer_name}},

This is a friendly reminder that your {{policy_type}} policy with {{company_name}} (Policy No. {{policy_number}}) is due for renewal on {{renewal_date}}.

To ensure your coverage continues without a break, please get in touch so we can complete the renewal before the due date.

Policy details:
- Policy Number: {{policy_number}}
- Insurer: {{company_name}}
- Renewal Date: {{renewal_date}}

Feel free to reach out if you have any questions.

Best regards,
Your Insurance Advisor`
};

const ICONS = {
  grid:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="2.5" width="6" height="6" rx="1.2"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.2"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.2"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.2"/></svg>',
  bell:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8a5 5 0 0 1 10 0c0 4 1.5 5 1.5 5h-13S5 12 5 8Z"/><path d="M8 15.5a2 2 0 0 0 4 0"/></svg>',
  list:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 5h9M7 10h9M7 15h9"/><circle cx="3.3" cy="5" r=".9" fill="currentColor" stroke="none"/><circle cx="3.3" cy="10" r=".9" fill="currentColor" stroke="none"/><circle cx="3.3" cy="15" r=".9" fill="currentColor" stroke="none"/></svg>',
  building:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="2.5" width="8" height="15" rx="1"/><path d="M8 6h.01M8 9h.01M8 12h.01M12 8h4v9.5H12"/></svg>',
  gear:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.8v1.6M10 15.6v1.6M17.2 10h-1.6M4.4 10H2.8M15 5l-1.1 1.1M6.1 13.9 5 15M15 15l-1.1-1.1M6.1 6.1 5 5"/></svg>',
  plus:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 4v12M4 10h12"/></svg>',
  search:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m17 17-4-4"/></svg>',
  edit:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12.5 3.5 16 7l-9 9H3.5v-3.5l9-9Z"/></svg>',
  trash:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5.5h12M8 5.5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M6 5.5 6.8 16a1 1 0 0 0 1 .9h4.4a1 1 0 0 0 1-.9l.8-10.5"/></svg>',
  mail:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="4.5" width="15" height="11" rx="1.4"/><path d="m3 5.5 7 5.5 7-5.5"/></svg>',
  check:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10.5 8 14.5 16 5.5"/></svg>',
  x:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5l10 10M15 5 5 15"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3Z"/></svg>',
  download:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3v10m0 0-4-4m4 4 4-4M4 16.5h12"/></svg>',
  refresh:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 10a6 6 0 1 1-2-4.5M16 3v4h-4"/></svg>',
  menu:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg>',
  warn:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2.5 18 17H2L10 2.5Z"/><path d="M10 8v3.5M10 14h.01"/></svg>',
};
function icon(name){return ICONS[name]||'';}

/* =========================================================================
   DEPLOY-TIME CONFIG
   If you're hosting ONE shared copy of this app for your team, fill these in
   before deploying so every advisor lands straight on the sign-in screen
   instead of each having to type in Supabase details themselves. This is
   NOT secret — the anon key is meant to be used from the browser; access
   control is enforced by Supabase Auth + Row Level Security, not by hiding
   this value. Leave a field blank to let people configure it from Settings
   instead.
========================================================================= */
const PRESET_CONFIG = {
  backend: 'supabase',       // 'supabase' | 'sheets' | 'local'  (leave '' to not override)
  supabaseUrl: '',   // e.g. 'https://xxxxx.supabase.co'
  supabaseKey: '',   // the anon public key, not the service_role key
  appsScriptUrl: '',
};

/* =========================================================================
   STATE
========================================================================= */
const state = {
  view:'dashboard',
  policies:[],
  companies:[],
  loading:false,
  sidebarOpen:false,
  settings:loadSettings(),
  filters:{
    renewal:'this_month', renewalMonth:'', renewalFrom:'', renewalTo:'', renewalSearch:'',
    polSearch:'', polCompany:'', polType:'', polStatus:'', polSort:'name'
  },
  selectedRenewalIds:new Set(),
  editingPolicy:null, // policy object or null, or {} for new
  modal:null, // {type:'policy'|'reminder'|'bulkReminder'|'confirm', ...}
  session:loadSession(), // Supabase auth session, null if logged out / not applicable
  authMode:'signin', // 'signin' | 'signup'
  authError:'', authBusy:false, authNotice:'',
};

function loadSettings(){
  try{
    const raw = localStorage.getItem('crm_settings_v1');
    if(raw) return Object.assign(defaultSettings(), JSON.parse(raw));
  }catch(e){}
  return defaultSettings();
}
function defaultSettings(){
  return {
    backend: PRESET_CONFIG.backend || 'local',
    supabaseUrl: PRESET_CONFIG.supabaseUrl || '',
    supabaseKey: PRESET_CONFIG.supabaseKey || '',
    appsScriptUrl: PRESET_CONFIG.appsScriptUrl || '',
    emailjsServiceId:'', emailjsTemplateId:'', emailjsPublicKey:'',
    template: Object.assign({}, DEFAULT_TEMPLATE),
    bannerDismissed:false,
  };
}
function saveSettings(){
  localStorage.setItem('crm_settings_v1', JSON.stringify(state.settings));
}
function loadSession(){
  try{
    const raw = localStorage.getItem('crm_session_v1');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function saveSession(session){
  state.session = session;
  if(session) localStorage.setItem('crm_session_v1', JSON.stringify(session));
  else localStorage.removeItem('crm_session_v1');
}

/* =========================================================================
   UTILITIES
========================================================================= */
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-'+Math.random().toString(36).slice(2)+Date.now();
}
function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function normalizeDate(v){
  if(!v) return '';
  const s = String(v);
  const m = s.match(/^\d{4}-\d{2}-\d{2}/);
  if(m) return m[0];
  // try parse Date object stringified
  const d = new Date(s);
  if(!isNaN(d)) return d.toISOString().slice(0,10);
  return s;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function formatDateDisplay(v){
  const d = normalizeDate(v);
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}
function monthYearKey(v){
  const d = normalizeDate(v);
  return d ? d.slice(0,7) : '';
}
function monthYearLabel(key){
  if(!key) return '';
  const [y,m] = key.split('-');
  const dt = new Date(parseInt(y), parseInt(m)-1, 1);
  return dt.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
}
function daysUntil(v){
  const d = normalizeDate(v);
  if(!d) return null;
  const target = new Date(d+'T00:00:00');
  const today = new Date(todayStr()+'T00:00:00');
  return Math.round((target-today)/86400000);
}
function currency(n){
  if(n===null||n===undefined||n==='') return '—';
  const num = parseFloat(n);
  if(isNaN(num)) return '—';
  return '₹'+num.toLocaleString('en-IN',{maximumFractionDigits:0});
}
function urgencyBadge(dl){
  if(dl===null) return '<span class="badge neutral">No date</span>';
  if(dl<0) return `<span class="badge bad">${icon('warn')} Overdue ${Math.abs(dl)}d</span>`;
  if(dl===0) return `<span class="badge bad">Due today</span>`;
  if(dl<=30) return `<span class="badge warn">Due in ${dl}d</span>`;
  return `<span class="badge good">Due in ${dl}d</span>`;
}
function statusBadge(s){
  const cls = s==='Active'?'good':s==='Renewed'?'brass':s==='Lapsed'?'bad':'neutral';
  return `<span class="badge ${cls}">${escapeHtml(s||'Active')}</span>`;
}
function resolveTemplate(str, p){
  return (str||'').replace(/\{\{(\w+)\}\}/g, (_,key)=>{
    if(key==='renewal_date') return formatDateDisplay(p.renewal_date);
    if(key==='issue_date') return formatDateDisplay(p.issue_date);
    return p[key]!==undefined && p[key]!==null ? p[key] : '';
  });
}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}

function showToast(msg, type){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast'+(type==='err'?' err':type==='ok'?' ok':'');
  el.innerHTML = (type==='ok'?icon('check'):type==='err'?icon('x'):'')+`<span>${escapeHtml(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.25s'; setTimeout(()=>el.remove(),250); }, 3200);
}

const LocalProvider = {
  key_p:'crm_policies_v1', key_c:'crm_companies_v1',
  _read(key){ try{ return JSON.parse(localStorage.getItem(key))||[]; }catch(e){ return []; } },
  _write(key, val){ localStorage.setItem(key, JSON.stringify(val)); },
  async testConnection(){ return {ok:true, message:'Local browser storage ready.'}; },
  async listPolicies(){ return this._read(this.key_p); },
  async createPolicy(payload){
    const list = this._read(this.key_p);
    const record = Object.assign({id:uid(), created_at:new Date().toISOString(), status:'Active'}, payload);
    list.push(record); this._write(this.key_p, list); return record;
  },
  async updatePolicy(id, payload){
    const list = this._read(this.key_p);
    const idx = list.findIndex(p=>p.id===id);
    if(idx===-1) throw new Error('Policy not found');
    list[idx] = Object.assign({}, list[idx], payload);
    this._write(this.key_p, list); return list[idx];
  },
  async deletePolicy(id){
    let list = this._read(this.key_p);
    list = list.filter(p=>p.id!==id);
    this._write(this.key_p, list); return true;
  },
  async listCompanies(){ return this._read(this.key_c); },
  async addCompany(name){
    const list = this._read(this.key_c);
    const record = {id:uid(), name};
    list.push(record); this._write(this.key_c, list); return record;
  },
  async deleteCompany(id){
    let list = this._read(this.key_c);
    list = list.filter(c=>c.id!==id);
    this._write(this.key_c, list); return true;
  },
};

const SupabaseProvider = {
  base(){ return state.settings.supabaseUrl.replace(/\/$/,''); },
  async headers(){
    await ensureFreshSession();
    const anon = state.settings.supabaseKey;
    const userToken = state.session ? state.session.access_token : null;
    return {
      'apikey': anon,
      'Authorization': 'Bearer ' + (userToken || anon), // user token drives RLS once logged in
      'Content-Type':'application/json', 'Prefer':'return=representation'
    };
  },
  async testConnection(){
    // Checks the project URL + anon key are valid, independent of login state.
    try{
      const r = await fetch(`${this.base()}/auth/v1/settings`, {headers:{apikey: state.settings.supabaseKey}});
      if(!r.ok) return {ok:false, message:'Connection failed ('+r.status+'). Check your Project URL and anon key.'};
      return {ok:true, message:'Project reachable. Sign in below to load your policies.'};
    }catch(e){ return {ok:false, message:'Could not reach Supabase: '+e.message}; }
  },
  async listPolicies(){
    const r = await fetch(`${this.base()}/rest/v1/policies?select=*&order=renewal_date.asc`, {headers:await this.headers()});
    if(!r.ok) throw new Error('Failed to load policies ('+r.status+')');
    return await r.json();
  },
  async createPolicy(payload){
    const r = await fetch(`${this.base()}/rest/v1/policies`, {method:'POST', headers:await this.headers(), body:JSON.stringify(payload)});
    if(!r.ok) throw new Error('Failed to create policy ('+r.status+')');
    const data = await r.json(); return data[0];
  },
  async updatePolicy(id, payload){
    const r = await fetch(`${this.base()}/rest/v1/policies?id=eq.${id}`, {method:'PATCH', headers:await this.headers(), body:JSON.stringify(payload)});
    if(!r.ok) throw new Error('Failed to update policy ('+r.status+')');
    const data = await r.json(); return data[0];
  },
  async deletePolicy(id){
    const r = await fetch(`${this.base()}/rest/v1/policies?id=eq.${id}`, {method:'DELETE', headers:await this.headers()});
    if(!r.ok) throw new Error('Failed to delete policy ('+r.status+')');
    return true;
  },
  async listCompanies(){
    const r = await fetch(`${this.base()}/rest/v1/companies?select=*&order=name.asc`, {headers:await this.headers()});
    if(!r.ok) throw new Error('Failed to load companies ('+r.status+')');
    return await r.json();
  },
  async addCompany(name){
    const r = await fetch(`${this.base()}/rest/v1/companies`, {method:'POST', headers:await this.headers(), body:JSON.stringify({name})});
    if(!r.ok) throw new Error('Failed to add company ('+r.status+')');
    const data = await r.json(); return data[0];
  },
  async deleteCompany(id){
    const r = await fetch(`${this.base()}/rest/v1/companies?id=eq.${id}`, {method:'DELETE', headers:await this.headers()});
    if(!r.ok) throw new Error('Failed to delete company ('+r.status+')');
    return true;
  },
};

/* ---------------- Supabase Auth (email + password) ---------------- */
function supaBase(){ return state.settings.supabaseUrl.replace(/\/$/,''); }
async function authSignUp(email, password){
  const r = await fetch(`${supaBase()}/auth/v1/signup`, {
    method:'POST', headers:{apikey:state.settings.supabaseKey, 'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });
  const data = await r.json();
  if(!r.ok) throw new Error(data.error_description || data.msg || data.error || 'Sign up failed');
  if(data.access_token){
    saveSession(sessionFromAuthResponse(data));
    return {loggedIn:true};
  }
  return {loggedIn:false}; // email confirmation required before sign in
}
async function authSignIn(email, password){
  const r = await fetch(`${supaBase()}/auth/v1/token?grant_type=password`, {
    method:'POST', headers:{apikey:state.settings.supabaseKey, 'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });
  const data = await r.json();
  if(!r.ok) throw new Error(data.error_description || data.msg || data.error || 'Sign in failed');
  saveSession(sessionFromAuthResponse(data));
}
async function authSignOut(){
  try{
    if(state.session){
      await fetch(`${supaBase()}/auth/v1/logout`, {method:'POST', headers:{apikey:state.settings.supabaseKey, 'Authorization':'Bearer '+state.session.access_token}});
    }
  }catch(e){}
  saveSession(null);
  state.policies = []; state.companies = [];
}
function sessionFromAuthResponse(data){
  return {
    access_token: data.access_token, refresh_token: data.refresh_token,
    expires_at: Date.now() + (data.expires_in||3600)*1000,
    user: {id: data.user.id, email: data.user.email}
  };
}
async function ensureFreshSession(){
  if(!state.session) return;
  if(Date.now() < state.session.expires_at - 60000) return; // still valid
  try{
    const r = await fetch(`${supaBase()}/auth/v1/token?grant_type=refresh_token`, {
      method:'POST', headers:{apikey:state.settings.supabaseKey, 'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: state.session.refresh_token})
    });
    const data = await r.json();
    if(!r.ok) throw new Error('refresh failed');
    saveSession(sessionFromAuthResponse(data));
  }catch(e){
    saveSession(null); // session expired/invalid — back to login screen
  }
}

const SheetsProvider = {
  url(){ return state.settings.appsScriptUrl; },
  async call(action, payload){
    const r = await fetch(this.url(), {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action, payload})
    });
    const json = await r.json();
    if(!json.ok) throw new Error(json.error||'Request failed');
    return json.data;
  },
  async testConnection(){
    try{
      const data = await this.call('ping', {});
      return {ok:true, message: data && data.message ? data.message : 'Connected to Google Sheets.'};
    }catch(e){ return {ok:false, message:'Could not reach Apps Script: '+e.message}; }
  },
  async listPolicies(){ return await this.call('listPolicies', {}); },
  async createPolicy(payload){ return await this.call('createPolicy', payload); },
  async updatePolicy(id, payload){ return await this.call('updatePolicy', Object.assign({id}, payload)); },
  async deletePolicy(id){ await this.call('deletePolicy', {id}); return true; },
  async listCompanies(){ return await this.call('listCompanies', {}); },
  async addCompany(name){ return await this.call('addCompany', {name}); },
  async deleteCompany(id){ await this.call('deleteCompany', {id}); return true; },
  async sendEmail(to, subject, body){ return await this.call('sendEmail', {to, subject, body}); },
};

function getProvider(){
  if(state.settings.backend==='supabase') return SupabaseProvider;
  if(state.settings.backend==='sheets') return SheetsProvider;
  return LocalProvider;
}

async function sendReminderEmail(policy, subject, body){
  const backend = state.settings.backend;
  if(backend==='sheets'){
    await SheetsProvider.sendEmail(policy.email, subject, body);
    return true;
  }
  if(backend==='supabase'){
    const s = state.settings;
    if(!s.emailjsServiceId||!s.emailjsTemplateId||!s.emailjsPublicKey){
      throw new Error('EmailJS is not configured yet. Add your Service ID, Template ID and Public Key in Settings.');
    }
    if(!window.emailjs) throw new Error('EmailJS library failed to load.');
    await emailjs.send(s.emailjsServiceId, s.emailjsTemplateId, {
      to_email: policy.email, to_name: policy.customer_name,
      subject: subject, message: body,
      policy_number: policy.policy_number, company_name: policy.company_name,
      renewal_date: formatDateDisplay(policy.renewal_date),
    }, s.emailjsPublicKey);
    return true;
  }
  // local demo mode — simulate
  await new Promise(res=>setTimeout(res, 500));
  return true;
}

   DATA LOADING
========================================================================= */
async function loadAll(){
  if(state.settings.backend==='supabase' && !state.session){
    state.policies=[]; state.companies=[]; render(); return; // wait for login
  }
  state.loading = true; render();
  try{
    const provider = getProvider();
    const [policies, companies] = await Promise.all([provider.listPolicies(), provider.listCompanies()]);
    state.policies = (policies||[]).map(normalizePolicy);
    state.companies = companies||[];
    if(state.companies.length===0 && state.settings.backend!=='sheets'){
      for(const name of DEFAULT_COMPANIES){
        try{ await provider.addCompany(name); }catch(e){}
      }
      state.companies = await provider.listCompanies();
    }
  }catch(e){
    showToast('Could not load data: '+e.message, 'err');
  }
  state.loading = false; render();
}
function normalizePolicy(p){
  const np = Object.assign({}, p);
  np.issue_date = normalizeDate(np.issue_date);
  np.renewal_date = normalizeDate(np.renewal_date);
  np.last_reminder_sent = np.last_reminder_sent ? normalizeDate(np.last_reminder_sent) : '';
  np.status = np.status || 'Active';
  return np;
}

/* =========================================================================
   RENEWALS
========================================================================= */
function getFilteredRenewals(){
  const f = state.filters;
  let list = state.policies.filter(p=>p.status==='Active');
  if(f.renewalSearch){
    const q = f.renewalSearch.toLowerCase();
    list = list.filter(p=>(p.customer_name||'').toLowerCase().includes(q)||(p.policy_number||'').toLowerCase().includes(q)||(p.mobile||'').includes(q));
  }
  if(f.renewal==='overdue'){
    list = list.filter(p=>{const dl=daysUntil(p.renewal_date); return dl!==null && dl<0;});
  } else if(f.renewal==='this_month'){
    const key = todayStr().slice(0,7);
    list = list.filter(p=>monthYearKey(p.renewal_date)===key);
  } else if(f.renewal==='next_month'){
    const d = new Date(); d.setMonth(d.getMonth()+1);
    const key = d.toISOString().slice(0,7);
    list = list.filter(p=>monthYearKey(p.renewal_date)===key);
  } else if(f.renewal==='next30'){
    list = list.filter(p=>{const dl=daysUntil(p.renewal_date); return dl!==null && dl>=0 && dl<=30;});
  } else if(f.renewal==='next90'){
    list = list.filter(p=>{const dl=daysUntil(p.renewal_date); return dl!==null && dl>=0 && dl<=90;});
  } else if(f.renewal==='month' && f.renewalMonth){
    list = list.filter(p=>monthYearKey(p.renewal_date)===f.renewalMonth);
  } else if(f.renewal==='range' && f.renewalFrom && f.renewalTo){
    list = list.filter(p=>{const d=normalizeDate(p.renewal_date); return d>=f.renewalFrom && d<=f.renewalTo;});
  }
  list.sort((a,b)=>daysUntil(a.renewal_date)-daysUntil(b.renewal_date));
  return list;
}

function renderRenewals(){
  const f = state.filters;
  const list = getFilteredRenewals();
  const chips = [
    ['overdue','Overdue'],['this_month','This Month'],['next_month','Next Month'],
    ['next30','Next 30 Days'],['next90','Next 90 Days'],['month','Pick Month'],['range','Custom Range'],['all','All Active'],
  ];
  return `
    <div class="filter-bar">

function getFilteredPolicies(){
  const f = state.filters;
  let list = [...state.policies];
  if(f.polSearch){
    const q = f.polSearch.toLowerCase();
    list = list.filter(p=>(p.customer_name||'').toLowerCase().includes(q)||(p.policy_number||'').toLowerCase().includes(q)||(p.mobile||'').includes(q)||(p.email||'').toLowerCase().includes(q));
  }
  if(f.polCompany) list = list.filter(p=>p.company_name===f.polCompany);
  if(f.polType) list = list.filter(p=>p.policy_type===f.polType);
  if(f.polStatus) list = list.filter(p=>p.status===f.polStatus);
  if(f.polSort==='name') list.sort((a,b)=>(a.customer_name||'').localeCompare(b.customer_name||''));
  else if(f.polSort==='renewal') list.sort((a,b)=>normalizeDate(a.renewal_date).localeCompare(normalizeDate(b.renewal_date)));
  else if(f.polSort==='recent') list.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  return list;
}

        </div>
        ${state.authError?`<div class="banner" style="background:var(--bad-bg);border-color:#F0CFCB;color:var(--bad);">${icon('warn')}<span>${escapeHtml(state.authError)}</span></div>`:''}
        ${state.authNotice?`<div class="banner info"><span>${escapeHtml(state.authNotice)}</span></div>`:''}
        <div class="field"><label>Email</label><input type="email" id="auth-email" autocomplete="username"></div>
        <div class="field"><label>Password</label><input type="password" id="auth-password" autocomplete="${state.authMode==='signin'?'current-password':'new-password'}"></div>
        <button class="btn btn-brass" id="auth-submit" style="width:100%;justify-content:center;" ${state.authBusy?'disabled':''}>
          ${state.authBusy?'Please wait…':(state.authMode==='signin'?'Sign In':'Create Account')}
        </button>
        <div style="text-align:center;margin-top:16px;"><button class="btn btn-ghost btn-sm" id="goto-settings-link">Backend settings</button></div>
      </div>
    </div>
  </div>`;
}
function wireAuthEvents(){
  const gs = document.getElementById('goto-settings') || document.getElementById('goto-settings-link');
  if(gs) gs.onclick = ()=>{ state.view='settings'; state.authError=''; render(); };
  const tSignin = document.getElementById('tab-signin'), tSignup = document.getElementById('tab-signup');
  if(tSignin) tSignin.onclick = ()=>{ state.authMode='signin'; state.authError=''; state.authNotice=''; render(); };
  if(tSignup) tSignup.onclick = ()=>{ state.authMode='signup'; state.authError=''; state.authNotice=''; render(); };
  const submit = document.getElementById('auth-submit');
  if(submit) submit.onclick = handleAuthSubmit;
  const pwd = document.getElementById('auth-password');
  if(pwd) pwd.onkeydown = e=>{ if(e.key==='Enter') handleAuthSubmit(); };
}
async function handleAuthSubmit(){
  const emailEl = document.getElementById('auth-email'), pwdEl = document.getElementById('auth-password');
  const email = emailEl.value.trim(), password = pwdEl.value;
  if(!email || !password){ state.authError='Enter your email and password.'; render(); return; }
  if(state.authMode==='signup' && password.length<6){ state.authError='Password must be at least 6 characters.'; render(); return; }
  state.authBusy=true; state.authError=''; state.authNotice=''; render();
  try{
    if(state.authMode==='signup'){
      const res = await authSignUp(email, password);
      state.authBusy=false;
      if(res.loggedIn){ await loadAll(); }
      else { state.authMode='signin'; state.authNotice='Account created — check your email to confirm, then sign in.'; render(); }
    } else {
      await authSignIn(email, password);
      state.authBusy=false;
      await loadAll();
    }
  }catch(e){
    state.authBusy=false; state.authError=e.message; render();
  }
}

function renderModal(){
  const wrap = document.createElement('div');
  const m = state.modal;
  if(!m){ const existing=document.getElementById('modal-root'); if(existing) existing.remove(); return; }
  let inner = '';
  if(m.type==='policy') inner = policyFormModal(m.policy);
  if(m.type==='reminder') inner = reminderModal(m.policy);
  if(m.type==='bulkReminder') inner = bulkReminderModal();
  if(m.type==='confirm') inner = confirmModal(m);
  wrap.id='modal-root';

  document.body.appendChild(wrap);
  wireModalEvents();
}

        </div>

      <div class="modal-foot">
        <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button class="btn btn-brass" id="modal-send-bulk">${icon('mail')} Send to All</button>
      </div>
    </div>
  </div>`;
}

function confirmModal(m){
  return `
  <div class="overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-head"><h3>${escapeHtml(m.title)}</h3><button class="close-x" id="modal-close">${icon('x')}</button></div>
      <div class="modal-body"><p class="helptext">${escapeHtml(m.message)}</p></div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button class="btn btn-danger" id="modal-confirm-yes" style="background:var(--bad);color:#fff;">${escapeHtml(m.confirmLabel||'Confirm')}</button>
      </div>
    </div>
  </div>`;
}

/* =========================================================================
   EVENT WIRING
========================================================================= */
function wireContentEvents(){
  if(state.view==='dashboard'){
    document.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{state.view=el.dataset.goto;render();});
    document.querySelectorAll('[data-remind]').forEach(el=>el.onclick=()=>openReminderModal(el.dataset.remind));
    const db = document.getElementById('dismiss-banner');
    if(db) db.onclick = ()=>{ state.settings.bannerDismissed=true; saveSettings(); render(); };
  }
  else if(state.view==='renewals'){
    document.getElementById('renewal-search').oninput = debounce(e=>{state.filters.renewalSearch=e.target.value; renderContent();},250);
    document.querySelectorAll('[data-renewal-filter]').forEach(el=>el.onclick=()=>{
      state.filters.renewal = el.dataset.renewalFilter; render();
    });
    const mp = document.getElementById('renewal-month-picker');
    if(mp) mp.onchange = e=>{ state.filters.renewalMonth = e.target.value; renderContent(); };
    const rf = document.getElementById('renewal-from'), rt = document.getElementById('renewal-to');
    if(rf) rf.onchange = e=>{ state.filters.renewalFrom = e.target.value; renderContent(); };
    if(rt) rt.onchange = e=>{ state.filters.renewalTo = e.target.value; renderContent(); };
    const selAll = document.getElementById('select-all-renewals');
    if(selAll) selAll.onchange = e=>{
      const list = getFilteredRenewals();
      if(e.target.checked) list.forEach(p=>state.selectedRenewalIds.add(p.id));
      else list.forEach(p=>state.selectedRenewalIds.delete(p.id));
      render();
    };
    document.querySelectorAll('.renewal-check').forEach(el=>el.onchange=()=>{
      if(el.checked) state.selectedRenewalIds.add(el.dataset.id); else state.selectedRenewalIds.delete(el.dataset.id);
      render();
    });
    document.querySelectorAll('[data-remind]').forEach(el=>el.onclick=()=>openReminderModal(el.dataset.remind));
    document.querySelectorAll('[data-renew]').forEach(el=>el.onclick=()=>markRenewed(el.dataset.renew));
    document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>openPolicyModal(state.policies.find(p=>p.id===el.dataset.edit)));
    const bulkBtn = document.getElementById('btn-bulk-remind');
    if(bulkBtn) bulkBtn.onclick = ()=>{ state.modal={type:'bulkReminder'}; renderModal(); };
  }
  else if(state.view==='policies'){
    document.getElementById('pol-search').oninput = debounce(e=>{state.filters.polSearch=e.target.value; renderContent();},250);
    document.getElementById('pol-company').onchange = e=>{state.filters.polCompany=e.target.value; renderContent();};
    document.getElementById('pol-type').onchange = e=>{state.filters.polType=e.target.value; renderContent();};
    document.getElementById('pol-status').onchange = e=>{state.filters.polStatus=e.target.value; renderContent();};
    document.getElementById('pol-sort').onchange = e=>{state.filters.polSort=e.target.value; renderContent();};
    document.getElementById('btn-export-csv').onclick = exportCsv;
    document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>openPolicyModal(state.policies.find(p=>p.id===el.dataset.edit)));
    document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>confirmDeletePolicy(el.dataset.delete));
  }
  else if(state.view==='companies'){
    document.getElementById('btn-add-company').onclick = addCompanyHandler;
    document.getElementById('new-company-name').onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); addCompanyHandler(); } };
    document.querySelectorAll('[data-delete-company]').forEach(el=>el.onclick=()=>deleteCompanyHandler(el.dataset.deleteCompany));
  }
  else if(state.view==='settings'){
    document.querySelectorAll('input[name=backend]').forEach(el=>el.onchange=()=>{ state.settings.backend=el.value; renderContent(); });
    const saveBackendBtn = document.getElementById('btn-save-backend');
    if(saveBackendBtn) saveBackendBtn.onclick = saveBackendSettings;
    const testBtn = document.getElementById('btn-test-connection');
    if(testBtn) testBtn.onclick = testConnectionHandler;
    const settingsLogoutBtn = document.getElementById('btn-settings-logout');
    if(settingsLogoutBtn) settingsLogoutBtn.onclick = async ()=>{ await authSignOut(); render(); };
    const saveEmailBtn = document.getElementById('btn-save-email');
    if(saveEmailBtn) saveEmailBtn.onclick = ()=>{
      state.settings.emailjsServiceId = document.getElementById('emailjs-service').value.trim();
      state.settings.emailjsTemplateId = document.getElementById('emailjs-template').value.trim();
      state.settings.emailjsPublicKey = document.getElementById('emailjs-key').value.trim();
      saveSettings(); showToast('Email settings saved','ok');
    };
    document.getElementById('btn-save-template').onclick = ()=>{
      state.settings.template.subject = document.getElementById('tpl-subject').value;
      state.settings.template.body = document.getElementById('tpl-body').value;
      saveSettings(); showToast('Template saved','ok');
    };
    document.getElementById('btn-reset-template').onclick = ()=>{
      state.settings.template = Object.assign({}, DEFAULT_TEMPLATE); saveSettings(); renderContent(); showToast('Template reset to default','ok');
    };
  }
}

function wireModalEvents(){
  const overlay = document.getElementById('modal-overlay');
  const close = ()=>{ state.modal=null; renderModal(); };
  document.getElementById('modal-close').onclick = close;
  const cancel = document.getElementById('modal-cancel'); if(cancel) cancel.onclick = close;
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) close(); });

  const saveBtn = document.getElementById('modal-save');
  if(saveBtn) saveBtn.onclick = savePolicyFromForm;

  const sendBtn = document.getElementById('modal-send-reminder');
  if(sendBtn) sendBtn.onclick = ()=>doSendReminder(sendBtn.dataset.id);

  const sendBulkBtn = document.getElementById('modal-send-bulk');
  if(sendBulkBtn) sendBulkBtn.onclick = doSendBulkReminders;

  const confirmYes = document.getElementById('modal-confirm-yes');
  if(confirmYes) confirmYes.onclick = ()=>{ const action = state.modal.onConfirm; state.modal=null; renderModal(); if(action) action(); };
}

/* =========================================================================
   ACTIONS
========================================================================= */
function openPolicyModal(p){ state.editingPolicy = p; state.modal = {type:'policy', policy: p||{}}; renderModal(); }
function openReminderModal(id){ const p = state.policies.find(x=>x.id===id); if(!p) return; state.modal={type:'reminder', policy:p}; renderModal(); }

async function savePolicyFromForm(){
  const form = document.getElementById('policy-form');
  const fd = new FormData(form);
  const payload = {};
  fd.forEach((v,k)=>payload[k]=v);
  const required = ['customer_name','email','mobile','policy_number','policy_type','company_name','issue_date','renewal_date'];
  for(const r of required){ if(!payload[r]){ showToast('Please fill in all required fields', 'err'); return; } }
  const saveBtn = document.getElementById('modal-save');
  saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
  try{
    const provider = getProvider();
    if(state.editingPolicy && state.editingPolicy.id){
      const updated = await provider.updatePolicy(state.editingPolicy.id, payload);
      const idx = state.policies.findIndex(p=>p.id===state.editingPolicy.id);
      state.policies[idx] = normalizePolicy(Object.assign({}, state.policies[idx], updated||payload));
      showToast('Policy updated', 'ok');
    } else {
      const created = await provider.createPolicy(payload);
      state.policies.push(normalizePolicy(created));
      showToast('Policy added', 'ok');
    }
    state.modal = null; render();
  }catch(e){
    showToast('Could not save: '+e.message, 'err');
    saveBtn.disabled=false; saveBtn.textContent = state.editingPolicy && state.editingPolicy.id ? 'Save Changes':'Add Policy';
  }
}

function confirmDeletePolicy(id){
  const p = state.policies.find(x=>x.id===id); if(!p) return;
  state.modal = {type:'confirm', title:'Delete Policy', message:`Delete the policy record for ${p.customer_name} (${p.policy_number})? This cannot be undone.`, confirmLabel:'Delete', onConfirm: ()=>deletePolicyNow(id)};
  renderModal();
}
async function deletePolicyNow(id){
  try{
    await getProvider().deletePolicy(id);
    state.policies = state.policies.filter(p=>p.id!==id);
    state.selectedRenewalIds.delete(id);
    render(); showToast('Policy deleted','ok');
  }catch(e){ showToast('Could not delete: '+e.message,'err'); }
}

async function markRenewed(id){
  const p = state.policies.find(x=>x.id===id); if(!p) return;
  const oldRenewal = normalizeDate(p.renewal_date);
  const d = new Date(oldRenewal+'T00:00:00'); d.setFullYear(d.getFullYear()+1);
  const newRenewal = d.toISOString().slice(0,10);
  try{
    const updated = await getProvider().updatePolicy(id, {issue_date: oldRenewal, renewal_date:newRenewal, status:'Active', last_reminder_sent:''});
    const idx = state.policies.findIndex(x=>x.id===id);
    state.policies[idx] = normalizePolicy(Object.assign({}, p, updated || {issue_date:oldRenewal, renewal_date:newRenewal, status:'Active', last_reminder_sent:''}));
    render(); showToast(`Renewed — next renewal set to ${formatDateDisplay(newRenewal)}`,'ok');
  }catch(e){ showToast('Could not update: '+e.message,'err'); }
}

async function doSendReminder(id){
  const p = state.policies.find(x=>x.id===id); if(!p) return;
  const subject = document.getElementById('remind-subject').value;
  const body = document.getElementById('remind-body').value;
  const btn = document.getElementById('modal-send-reminder');
  btn.disabled = true; btn.textContent = 'Sending…';
  try{
    await sendReminderEmail(p, subject, body);
    const today = todayStr();
    await getProvider().updatePolicy(id, {last_reminder_sent: today});
    const idx = state.policies.findIndex(x=>x.id===id);
    state.policies[idx].last_reminder_sent = today;
    state.modal = null; render();
    showToast('Reminder sent to '+p.customer_name, 'ok');
  }catch(e){
    showToast('Could not send: '+e.message, 'err');
    btn.disabled=false; btn.innerHTML = icon('mail')+' Send Reminder';
  }
}

async function doSendBulkReminders(){
  const ids = [...state.selectedRenewalIds];
  const policies = state.policies.filter(p=>ids.includes(p.id));
  const subjectTpl = document.getElementById('bulk-subject').value;
  const bodyTpl = document.getElementById('bulk-body').value;
  const btn = document.getElementById('modal-send-bulk');
  btn.disabled = true;
  let sent = 0, failed = 0;
  for(const p of policies){
    btn.textContent = `Sending ${sent+failed+1} of ${policies.length}…`;
    try{
      await sendReminderEmail(p, resolveTemplate(subjectTpl,p), resolveTemplate(bodyTpl,p));
      const today = todayStr();
      await getProvider().updatePolicy(p.id, {last_reminder_sent: today});
      const idx = state.policies.findIndex(x=>x.id===p.id);
      if(idx>-1) state.policies[idx].last_reminder_sent = today;
      sent++;
    }catch(e){ failed++; }
  }
  state.modal = null; state.selectedRenewalIds.clear(); render();
  showToast(`Sent ${sent} reminder${sent===1?'':'s'}${failed?`, ${failed} failed`:''}`, failed? 'err':'ok');
}

async function addCompanyHandler(){
  const input = document.getElementById('new-company-name');
  const name = input.value.trim();
  if(!name) return;
  if(state.companies.some(c=>c.name.toLowerCase()===name.toLowerCase())){ showToast('That company is already in the list','err'); return; }
  try{
    const created = await getProvider().addCompany(name);
    state.companies.push(created); input.value=''; renderContent(); showToast('Company added','ok');
  }catch(e){ showToast('Could not add: '+e.message,'err'); }
}
async function deleteCompanyHandler(id){
  try{
    await getProvider().deleteCompany(id);
    state.companies = state.companies.filter(c=>c.id!==id);
    renderContent();
  }catch(e){ showToast('Could not remove: '+e.message,'err'); }
}

async function saveBackendSettings(){
  if(state.settings.backend==='supabase'){
    state.settings.supabaseUrl = document.getElementById('supabase-url').value.trim();
    state.settings.supabaseKey = document.getElementById('supabase-key').value.trim();
  } else if(state.settings.backend==='sheets'){
    state.settings.appsScriptUrl = document.getElementById('apps-script-url').value.trim();
  }
  saveSettings();
  if(state.settings.backend==='supabase' && !state.session){
    showToast('Backend saved — sign in to load your policies','ok');
  } else {
    showToast('Backend saved — reloading data…','ok');
  }
  await loadAll();
}
async function testConnectionHandler(){
  // capture any unsaved field values first
  if(state.settings.backend==='supabase'){
    state.settings.supabaseUrl = document.getElementById('supabase-url').value.trim();
    state.settings.supabaseKey = document.getElementById('supabase-key').value.trim();
  } else if(state.settings.backend==='sheets'){
    state.settings.appsScriptUrl = document.getElementById('apps-script-url').value.trim();
  }
  const resEl = document.getElementById('conn-result');
  resEl.innerHTML = `<span class="helptext">Testing…</span>`;
  const res = await getProvider().testConnection();
  resEl.innerHTML = `<span class="badge ${res.ok?'good':'bad'}">${escapeHtml(res.message)}</span>`;
}

function exportCsv(){
  const list = getFilteredPolicies();
  const headers = ['Customer Name','Email','Mobile','Policy Number','Policy Type','Company','Issue Date','Renewal Date','Premium','Sum Insured','Payment Frequency','Status','Notes'];
  const rows = list.map(p=>[p.customer_name,p.email,p.mobile,p.policy_number,p.policy_type,p.company_name,p.issue_date,p.renewal_date,p.premium_amount,p.sum_insured,p.payment_frequency,p.status,p.notes]);
  const csv = [headers, ...rows].map(r=>r.map(v=>{
    const s = (v===null||v===undefined)?'':String(v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'policies-export-'+todayStr()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* =========================================================================
   INIT
========================================================================= */
render();
loadAll();
</script>
